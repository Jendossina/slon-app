# Сборка Android-приложения (APK) в облаке.
#
# Локально собирать нечем: нужен Android SDK и JDK 17, а на рабочем ноутбуке
# стоит только Java 8. На runner'ах GitHub и то, и другое уже есть.
#
# Приложение — оболочка вокруг сайта: она открывает https://slon-app.vercel.app
# (адрес задан в capacitor.config.json). Значит, обычные правки кода доезжают до
# сотрудников сразу, как сейчас, и пересобирать APK для них НЕ нужно. Пересборка
# нужна, только если меняется сама оболочка: иконка, разрешения, адрес сайта.
#
# Запуск: вкладка Actions → «Android APK» → Run workflow. Готовый файл появится
# в разделе Releases, ссылку на него можно дать сотрудникам.
#
# Перед первым запуском нужно один раз добавить 4 секрета (Settings → Secrets and
# variables → Actions): SLON_KEYSTORE_BASE64, SLON_KEYSTORE_PASSWORD,
# SLON_KEY_ALIAS, SLON_KEY_PASSWORD. Как их получить — в docs/android-apk.md.

name: Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Версия для показа в приложении (например 1.0)'
        required: false
        default: '1.0'

permissions:
  contents: write   # нужно, чтобы приложить APK к релизу

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8 не запускается на Node ниже 22
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Проверить, что секреты подписи заданы
        env:
          KEYSTORE: ${{ secrets.SLON_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Нет секрета SLON_KEYSTORE_BASE64. Без ключа подписи APK не установится на телефон. См. docs/android-apk.md"
            exit 1
          fi

      - name: Установить зависимости
        run: npm ci

      - name: Собрать веб-часть оболочки
        run: npx cap sync android

      - name: Разложить ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.SLON_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/slon-release.jks"

      - name: Собрать APK
        working-directory: android
        env:
          SLON_KEYSTORE_PATH: ${{ runner.temp }}/slon-release.jks
          SLON_KEYSTORE_PASSWORD: ${{ secrets.SLON_KEYSTORE_PASSWORD }}
          SLON_KEY_ALIAS: ${{ secrets.SLON_KEY_ALIAS }}
          SLON_KEY_PASSWORD: ${{ secrets.SLON_KEY_PASSWORD }}
          # Номер сборки должен расти, иначе Android откажется ставить обновление
          SLON_VERSION_CODE: ${{ github.run_number }}
          SLON_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Проверить, что APK подписан
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::APK не собрался"; exit 1; }
          ls -lh "$APK"
          # apksigner лежит в build-tools; берём любую установленную версию
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$SIGNER" verify --print-certs "$APK"

      - name: Убрать ключ
        if: always()
        run: rm -f "$RUNNER_TEMP/slon-release.jks"

      - name: Выложить APK в релизы
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-v${{ inputs.version_name }}-${{ github.run_number }}"
          cp android/app/build/outputs/apk/release/app-release.apk slon-${{ inputs.version_name }}.apk
          NOTES="Приложение для Android. Скачай файл на телефон и открой — система предложит установить. Оболочка открывает сайт, поэтому правки приезжают сами: переустанавливать APK при обычных изменениях не нужно."
          gh release create "$TAG" "slon-${{ inputs.version_name }}.apk" \
            --title "Slon ${{ inputs.version_name }} (сборка ${{ github.run_number }})" \
            --notes "$NOTES"
